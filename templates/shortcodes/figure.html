{% component figure(src, ...attrs) %}
<figure class="center">
  <img src="{{ src | safe }}" {% if body %} alt="{{ body | safe }}" {% endif %} {% if attrs.width %} width="{{ attrs.width }}" {% endif %} {% if attrs.height %} height="{{ attrs.height }}" {% endif %} {% if attrs.loading %} loading="{{ attrs.loading }}" {% endif %}/>
  <figcaption>{{ body | markdown(inline=true) | safe }}</figcaption>
</figure>
{% endcomponent figure %}
